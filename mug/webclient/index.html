<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MUG</title>
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body>
    <div class="app">
      <!-- The head is the one part of the screen that does not change with the
           activity. The study name and the step are written by the client as
           the flow reports them; before that they are empty rather than wrong. -->
      <header class="head">
        <span class="brand">
          <span class="brand__mark" aria-hidden="true"></span>
          <span class="brand__name">MUG</span>
        </span>
        <span class="head__rule" aria-hidden="true"></span>
        <span class="head__study" id="study"></span>
        <span class="head__spacer"></span>
        <span class="progress" id="where" hidden></span>
        <span class="state" id="status">connecting...</span>
      </header>
      <div id="app"></div>
    </div>
    <script type="module" src="/static/main.js"></script>
  </body>
</html>
