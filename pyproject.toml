[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[project]
name = "multi_user_gymnasium"
version = "0.1.2"
description = "A platform for running interactive experiments in the browser with standard simulation environments."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">= 3.10"
authors = [
    { name = "Chase McDonald", email = "chasecmcdonald@gmail.com" },
]
dependencies = [
    "numpy",
]

[project.optional-dependencies]
server = [
    "eventlet",
    "flask",
    "flask-login>=0.6.3",
    "flask-socketio",
    "gymnasium",
    "msgpack",
    "pandas",
    "flatten_dict",
]
test = [
    "pytest>=8.0",
    "playwright>=1.49",
    "pytest-playwright>=0.6",
    "pytest-timeout>=2.3",
]
docs = [
    "zensical",
]

[tool.uv.build-backend]
# Flat layout: the `mug` package lives at the repo root (not under src/).
module-name = "mug"
module-root = ""
source-exclude = ["**/.DS_Store"]
wheel-exclude = ["**/.DS_Store"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
markers = [
    "timeout: marks test with custom timeout",
    "slow: marks tests as slow (may skip in CI)",
    "e2e: marks end-to-end tests requiring a running server and browser",
]
